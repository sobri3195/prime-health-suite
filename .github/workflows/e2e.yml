name: E2E (SIM Klinik registrasi)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          nohup bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          # Wait until :8080 responds
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server failed to start"; tail -100 /tmp/dev.log; exit 1

      - name: Run E2E suite
        run: python tests/e2e/run_all.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            /tmp/browser/**/shots/**
            /tmp/dev.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
