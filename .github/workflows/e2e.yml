name: E2E (SIM Klinik registrasi)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Cache bun's global install store keyed by lockfile
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Cache Playwright browsers (~120MB) keyed by installed playwright version
      - name: Resolve Playwright version
        id: pw
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          echo "version=$(python -c 'import playwright,importlib.metadata as m; print(m.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium


      - name: Start dev server
        run: |
          nohup bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          # Wait until :8080 responds
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server failed to start"; tail -100 /tmp/dev.log; exit 1

      - name: Run E2E suite
        run: python tests/e2e/run_all.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            /tmp/browser/**/shots/**
            /tmp/dev.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
