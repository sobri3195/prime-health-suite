name: E2E (SIM Klinik registrasi)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [ -n "${VITE_SUPABASE_URL}" ]               || missing+=("VITE_SUPABASE_URL")
          [ -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]   || missing+=("VITE_SUPABASE_PUBLISHABLE_KEY")
          [ -n "${VITE_SUPABASE_PROJECT_ID}" ]        || missing+=("VITE_SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Set them under: Repo → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          echo "version=$(python -c 'import playwright,importlib.metadata as m; print(m.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Start dev server (with retry)
        run: |
          start_server() {
            nohup bun run dev > /tmp/dev.log 2>&1 &
            echo $! > /tmp/dev.pid
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8080 > /dev/null; then
                echo "dev server up after ${i}s"; return 0
              fi
              sleep 1
            done
            return 1
          }
          for attempt in 1 2 3; do
            echo "::group::dev server start attempt ${attempt}"
            if start_server; then
              echo "::endgroup::"; exit 0
            fi
            echo "attempt ${attempt} failed; last log:"
            tail -50 /tmp/dev.log || true
            kill "$(cat /tmp/dev.pid 2>/dev/null)" 2>/dev/null || true
            rm -f /tmp/dev.pid
            echo "::endgroup::"
            sleep 3
          done
          echo "::error::dev server failed to start after 3 attempts"
          tail -200 /tmp/dev.log || true
          exit 1

      - name: Run E2E suite (parallel + retry)
        env:
          E2E_WORKERS: "4"
          E2E_RETRIES: "2"
          E2E_TIMEOUT: "240"
        run: python tests/e2e/run_all.py


      - name: Upload screenshots & logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/browser/**/shots/**
            /tmp/dev.log
            tests/e2e/logs/**
          if-no-files-found: ignore


      - name: Stop dev server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
